<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindAR image tracking</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0e13;
  }
  #ar-container {
    position: fixed;
    inset: 0;
  }
  #hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #fff;
    font-family: sans-serif;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    padding: 8px 16px;
    border-radius: 4px;
    text-align: center;
  }
</style>

<!-- Import map: lets the module script below use "three" and "mindar-image-three" as bare names -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div id="hint">Point your camera at the marker image</div>
<div id="ar-container"></div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-image-three';

  // ---- 1. Set up MindAR — this creates the camera feed + three.js scene/camera for us ----
  const mindarThree = new MindARThree({
    container: document.querySelector('#ar-container'),
    imageTargetSrc: './targets.mind', // <-- the file you compile from your marker image
  });

  const { renderer, scene, camera } = mindarThree;

  // ---- 2. Lighting (added to the main scene, so it's always present) ----
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // ---- 3. Anchor: a group that MindAR automatically shows/hides and moves
  //         to match the tracked marker's position, in real time ----
  const anchor = mindarThree.addAnchor(0); // 0 = first (and only) target in targets.mind

  // ---- 4. Load the avatar model and attach it to the anchor, not the scene directly ----
  let mixer;
  const clock = new THREE.Clock();

  const loader = new GLTFLoader();
  loader.load(
    'model.glb',
    (gltf) => {
      const avatar = gltf.scene;

      // scale/position here are relative to the marker, which MindAR treats as
      // roughly 1 unit wide — a full "person" model will likely need to be tiny.
      avatar.scale.set(0.05, 0.05, 0.05);
      avatar.position.set(0, 0, 0);

      anchor.group.add(avatar);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        mixer.clipAction(gltf.animations[0]).play();
      }
    },
    undefined,
    (error) => console.error('Failed to load model.glb:', error)
  );

  // ---- 5. Start the AR session and render loop ----
  const start = async () => {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      if (mixer) mixer.update(clock.getDelta());
      renderer.render(scene, camera);
    });
  };
  start();
</script>

</body>
</html>
