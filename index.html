<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>three.js starter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0e13;
  }
  canvas { display: block; }

  #camera-feed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  #orb-canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
</style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.122.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.122.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
  // ---- 1. Scene, camera, renderer ----
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    45,                                     // field of view
    window.innerWidth / window.innerHeight, // aspect ratio
    0.1,                                    // near clip
    100                                     // far clip
  );
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.id = 'orb-canvas';
  document.body.appendChild(renderer.domElement);

  // ---- Webcam feed as the page background ----
  const video = document.getElementById('camera-feed');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then((stream) => {
      video.srcObject = stream;
    })
    .catch((err) => {
      console.error('Could not access camera:', err);
      document.body.style.background = '#0a0e13'; // fallback if camera is denied
    });

  // ---- 2. Lighting ----
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x4ce0d2, 1);
  dirLight.position.set(3, 4, 5);
  scene.add(dirLight);

  // ---- 3. Load the avatar model (model.glb) ----
  let avatar;   // will point at the loaded model once it's ready
  let mixer;    // drives any animation clips baked into the GLB

  const clock = new THREE.Clock();
  const loader = new THREE.GLTFLoader();
  loader.load(
    'model (1).glb',
    (gltf) => {
      avatar = gltf.scene;

      // GLB models come in at whatever scale/position they were exported with —
      // these three lines are the ones you'll most likely need to tweak.
      avatar.scale.set(1, 1, 1);
      avatar.position.set(0, -1.5, 0); // nudge down if it's a full-body figure
      avatar.rotation.y = Math.PI;     // many exports face away from the camera by default

      scene.add(avatar);

      // Play the first animation clip found in the file, if any.
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
        console.log(`Playing animation: "${gltf.animations[0].name}"`);
      } else {
        console.log('No animations found in model.glb');
      }
    },
    (progress) => {
      if (progress.total) {
        console.log(`Loading model: ${Math.round((progress.loaded / progress.total) * 100)}%`);
      }
    },
    (error) => {
      console.error('Failed to load model.glb:', error);
    }
  );

  // ---- 4. Animation loop ----
  function animate() {
    requestAnimationFrame(animate);

    if (mixer) {
      mixer.update(clock.getDelta());
    }

    renderer.render(scene, camera);
  }
  animate();

  // ---- 5. Handle window resize ----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
