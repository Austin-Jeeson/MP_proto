<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindAR image tracking + Convai avatar</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0e13;
  }
  #ar-container {
    position: fixed;
    inset: 0;
  }
  #hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #fff;
    font-family: sans-serif;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    padding: 8px 16px;
    border-radius: 4px;
    text-align: center;
  }
  #debug {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 45vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.85);
    color: #4ce0d2;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    padding: 10px 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #debug .err { color: #ff7a6b; }

  /* CHANGED: floating overlay that carries the Convai avatar video.
     This sits ON TOP of the MindAR canvas (not inside the Three.js scene) —
     see explanation in chat about why the avatar can't be a THREE.Object3D. */
  #convai-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 220px;
    height: 220px;
    z-index: 5;
    pointer-events: none;   /* let AR camera drag/taps pass through */
    transform-origin: center bottom;
    display: none;          /* shown only while the marker is tracked */
    border-radius: 12px;
    overflow: hidden;
    background: rgba(0,0,0,0.15); /* faint so you can see the container while tuning */
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<!-- CHANGED: Convai Pixel Streaming embed (UMD build, exposes window.PixelStreamClient).
     No bundler needed, matches the plain-script style of the rest of this file. -->
<script src="https://unpkg.com/@convai/experience-embed/dist/convai-embed.umd.js"></script>
</head>
<body>

<div id="hint">Point your camera at the marker image</div>
<div id="ar-container"></div>

<!-- CHANGED: Convai avatar mount point -->
<div id="convai-overlay"></div>

<div id="debug"></div>

<script>
  const debugEl = document.getElementById('debug');
  function log(msg, isError) {
    const line = document.createElement('div');
    if (isError) line.className = 'err';
    line.textContent = (isError ? '[ERROR] ' : '[LOG] ') + msg;
    debugEl.appendChild(line);
  }
  window.addEventListener('error', (e) => log(e.message + ' (' + e.filename + ':' + e.lineno + ')', true));
  window.addEventListener('unhandledrejection', (e) => log('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true));
  log('Debug console active. Waiting for module script...');
</script>

<script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'mindar-image-three';
  // CHANGED: GLTFLoader import removed — no 3D model to load anymore.

  const log = (msg, isError) => {
    const line = document.createElement('div');
    if (isError) line.className = 'err';
    line.textContent = (isError ? '[ERROR] ' : '[LOG] ') + msg;
    document.getElementById('debug').appendChild(line);
  };

  log('Module script started.');

  // ---- 1. MindAR setup — unchanged, this still gives us camera feed + tracking ----
  const mindarThree = new MindARThree({
    container: document.querySelector('#ar-container'),
    imageTargetSrc: './targets.mind',
  });
  log('MindARThree instance created.');

  const { renderer, scene, camera } = mindarThree;

  // ---- 2. Lighting — harmless to keep even with no 3D model, but you can delete this
  //         block entirely since nothing in the scene needs lighting anymore.
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // ---- 3. Anchor — unchanged. MindAR still moves this to match the tracked marker;
  //         we just no longer parent a 3D mesh to it. Instead we read its position
  //         each frame to drive the HTML overlay below. ----
  const anchor = mindarThree.addAnchor(0);

  // ---- 4. CHANGED: Convai avatar setup (replaces GLTFLoader block) ----
  const CONVAI_EXP_ID = 'your-experience-id'; // <-- from Avatar Studio publish step

  const overlayEl = document.getElementById('convai-overlay');
  let pixelStream = null;
  let pixelStreamReady = false;

  function initConvaiAvatar() {
    if (pixelStream) return; // only initialize once
    log('Initializing Convai Pixel Stream...');
    try {
      pixelStream = new window.PixelStreamClient({
        container: overlayEl,
        expId: CONVAI_EXP_ID,
      });
      pixelStream.initializeExperience();
      pixelStreamReady = true;
      log('Convai Pixel Stream initialized.');
    } catch (err) {
      log('Failed to initialize Convai Pixel Stream: ' + (err && err.message ? err.message : err), true);
    }
  }

  // Show/hide the overlay based on whether the marker is currently tracked.
  // targetFound/targetLost are emitted on the anchor by MindAR.
  anchor.onTargetFound = () => {
    log('Target found.');
    if (!pixelStream) initConvaiAvatar(); // lazy-init on first detection
    overlayEl.style.display = 'block';
  };
  anchor.onTargetLost = () => {
    log('Target lost.');
    overlayEl.style.display = 'none';
  };

  // ---- 5. CHANGED: billboard projection — replaces the animation mixer block.
  //         Projects the anchor's tracked 3D position into 2D screen space each
  //         frame and moves/scales the overlay div to follow it. ----
  const anchorWorldPos = new THREE.Vector3();
  const BASE_SCALE = 1.4; // tune this: bigger = avatar appears larger at a given distance

  function updateOverlayTransform() {
    if (overlayEl.style.display === 'none') return;

    anchor.group.getWorldPosition(anchorWorldPos);

    // Project to normalized device coordinates (-1..1), then to CSS pixels.
    const ndc = anchorWorldPos.clone().project(camera);
    const screenX = (ndc.x * 0.5 + 0.5) * window.innerWidth;
    const screenY = (-ndc.y * 0.5 + 0.5) * window.innerHeight;

    // Scale inversely with distance so the avatar shrinks as the marker moves away.
    const distance = camera.position.distanceTo(anchorWorldPos);
    const scale = Math.min(2.5, BASE_SCALE / Math.max(distance, 0.01));

    // Anchor point: bottom-center of the overlay sits on the marker's projected position
    // (like the avatar "standing" on the marker). Adjust to taste.
    overlayEl.style.transform =
      `translate(${screenX - overlayEl.offsetWidth / 2}px, ${screenY - overlayEl.offsetHeight}px) scale(${scale})`;
  }

  // ---- 6. Start the AR session and render loop ----
  const start = async () => {
    try {
      log('Calling mindarThree.start()...');
      await mindarThree.start();
      log('mindarThree.start() resolved — tracking is live.');
      renderer.setAnimationLoop(() => {
        updateOverlayTransform(); // CHANGED: replaces mixer.update(...)
        renderer.render(scene, camera);
      });
    } catch (err) {
      log('mindarThree.start() threw: ' + (err && err.message ? err.message : err), true);
    }
  };
  start();
</script>

</body>
</html>
