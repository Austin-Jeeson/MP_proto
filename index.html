<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindAR image tracking</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0e13;
  }
  #ar-container {
    position: fixed;
    inset: 0;
  }
  #hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #fff;
    font-family: sans-serif;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    padding: 8px 16px;
    border-radius: 4px;
    text-align: center;
  }
  #debug {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 45vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.85);
    color: #4ce0d2;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    padding: 10px 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #debug .err { color: #ff7a6b; }
</style>

<!-- Import map: lets the module script below use "three" and "mindar-image-three" as bare names -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div id="hint">Point your camera at the marker image</div>
<div id="ar-container"></div>
<div id="debug"></div>

<script>
  // Plain (non-module) script so it runs even if the module below fails to load at all.
  const debugEl = document.getElementById('debug');
  function log(msg, isError) {
    const line = document.createElement('div');
    if (isError) line.className = 'err';
    line.textContent = (isError ? '[ERROR] ' : '[LOG] ') + msg;
    debugEl.appendChild(line);
  }
  window.addEventListener('error', (e) => log(e.message + ' (' + e.filename + ':' + e.lineno + ')', true));
  window.addEventListener('unhandledrejection', (e) => log('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true));
  log('Debug console active. Waiting for module script...');
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-image-three';

  const log = (msg, isError) => {
    const line = document.createElement('div');
    if (isError) line.className = 'err';
    line.textContent = (isError ? '[ERROR] ' : '[LOG] ') + msg;
    document.getElementById('debug').appendChild(line);
  };

  log('Module script started.');

  // ---- 1. Set up MindAR — this creates the camera feed + three.js scene/camera for us ----
  const mindarThree = new MindARThree({
    container: document.querySelector('#ar-container'),
    imageTargetSrc: './targets.mind', // <-- the file you compile from your marker image
  });
  log('MindARThree instance created.');

  const { renderer, scene, camera } = mindarThree;

  // ---- 2. Lighting (added to the main scene, so it's always present) ----
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // ---- 3. Anchor: a group that MindAR automatically shows/hides and moves
  //         to match the tracked marker's position, in real time ----
  const anchor = mindarThree.addAnchor(0); // 0 = first (and only) target in targets.mind

  // ---- 4. Load the avatar model and attach it to the anchor, not the scene directly ----
  let mixer;
  const clock = new THREE.Clock();

  const loader = new GLTFLoader();
  loader.load(
    'model.glb',
    (gltf) => {
      log('model.glb loaded successfully.');
      const avatar = gltf.scene;

      // scale/position here are relative to the marker, which MindAR treats as
      // roughly 1 unit wide — a full "person" model will likely need to be tiny.
      avatar.scale.set(0.05, 0.05, 0.05);
      avatar.position.set(0, 0, 0);

      anchor.group.add(avatar);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        mixer.clipAction(gltf.animations[0]).play();
      }
    },
    (progress) => {
      if (progress.total) log('Loading model.glb: ' + Math.round((progress.loaded / progress.total) * 100) + '%');
    },
    (error) => log('Failed to load model.glb: ' + error.message, true)
  );

  // ---- 5. Start the AR session and render loop ----
  const start = async () => {
    try {
      log('Calling mindarThree.start()...');
      await mindarThree.start();
      log('mindarThree.start() resolved — tracking is live.');
      renderer.setAnimationLoop(() => {
        if (mixer) mixer.update(clock.getDelta());
        renderer.render(scene, camera);
      });
    } catch (err) {
      log('mindarThree.start() threw: ' + (err && err.message ? err.message : err), true);
    }
  };
  start();
</script>

</body>
</html>
